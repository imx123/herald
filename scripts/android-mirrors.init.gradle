// Prefer domestic mirrors without changing the upstream repository settings.
// Official repositories declared in settings.gradle.kts remain fallbacks.
beforeSettings { settings ->
    settings.pluginManagement.repositories {
        // Keep the KSP marker and implementation in one mirror; mixed metadata
        // from the Aliyun plugin mirror failed on the fork's clean CI cache.
        maven {
            url = 'https://repo.huaweicloud.com/repository/maven/'
            content { includeGroup('com.google.devtools.ksp') }
        }
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
    settings.dependencyResolutionManagement.repositories {
        maven {
            url = 'https://repo.huaweicloud.com/repository/maven/'
            content { includeGroup('com.google.devtools.ksp') }
        }
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}
