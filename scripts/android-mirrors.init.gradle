// Prefer domestic mirrors without changing the upstream repository settings.
// Official repositories declared in settings.gradle.kts remain fallbacks.
beforeSettings { settings ->
    settings.pluginManagement.repositories {
        // Resolve the KSP marker/implementation and Compose Unstyled variants
        // together; these groups failed to resolve in the Aliyun CI cache.
        maven {
            url = 'https://repo.huaweicloud.com/repository/maven/'
            content {
                includeGroup('com.google.devtools.ksp')
                includeGroup('com.composables')
            }
        }
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
    settings.dependencyResolutionManagement.repositories {
        maven {
            url = 'https://repo.huaweicloud.com/repository/maven/'
            content {
                includeGroup('com.google.devtools.ksp')
                includeGroup('com.composables')
            }
        }
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}
